<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard Gabungan</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <main class="dashboard">

    <!-- =========================
         VIEW 30%
    ========================== -->

    <section class="view-panel">

      <div id="loading">
        Memuat Report SPT...
      </div>

      <div
        id="error"
        style="display:none;"
      ></div>

      <div id="sheet-container"></div>

    </section>


    <!-- =========================
         LIST 70%
    ========================== -->

    <section class="list-panel">

      <div id="list-container">

        <!--
          Semua isi LIST akan dibuat
          otomatis oleh script.js
        -->

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
